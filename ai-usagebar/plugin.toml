id = "felipeartur/ai-usagebar"
name = "AI Usage"
version = "2.17.0"
plugin_api = 43
author = "felipeartur"
license = "MIT"
icon = "brain"
description = "AI plan usage in the bar, powered by the ai-usagebar CLI."
tags = ["bar", "panel", "ai", "indicator", "utility"]
# The CLI owns credentials, vendor endpoints and caching. This plugin runs
# `ai-usagebar usage --json` and `ai-usagebar account status --json` on every
# poll, `ai-usagebar vendors --json` on request, and
# `ai-usagebar account switch <label> --cli` when a switch button is pressed.
dependencies = ["ai-usagebar", "xdg-open"]

# ── Plugin-level settings (shared by the poller, every capsule and the panel) ──

# No path setting: `ai-usagebar` is a declared dependency, so it is on PATH.

[[setting]]
key = "refresh_minutes"
type = "int"
label_key = "settings.refresh_minutes.label"
description_key = "settings.refresh_minutes.description"
default = 5
min = 1
max = 120

[[setting]]
key = "usage_display"
type = "select"
label_key = "settings.usage_display.label"
description_key = "settings.usage_display.description"
default = "used"
options = [
  { value = "used", label_key = "settings.usage_display.option.used" },
  { value = "remaining", label_key = "settings.usage_display.option.remaining" },
]

[[setting]]
key = "show_priorities"
type = "bool"
label_key = "settings.show_priorities.label"
description_key = "settings.show_priorities.description"
default = false

# ── Entries ───────────────────────────────────────────────────────────────────

# One poller for the whole shell: a single `usage --json` call returns every
# vendor, so N capsules on M monitors still cost one process per cycle.
[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

# Right click asks the poller for a read. Declared rather than handled in
# bar.luau because a binding is what the settings editor lists and what a user
# can point somewhere else; an onRightClick callback is neither.
#
# Left stays in the script so it can open the panel at the active Claude account.
  [widget.actions]
  right = "plugin felipeartur/ai-usagebar:poller all refresh"

[[widget.setting]]
key = "panel_view"
type = "select"
label_key = "settings.panel_view.label"
description_key = "settings.panel_view.description"
default = "overview"
options = [
  { value = "overview", label_key = "settings.panel_view.option.overview" },
  { value = "provider", label_key = "settings.panel_view.option.provider" },
]

[[widget.setting]]
key = "show_glyph"
type = "bool"
label_key = "settings.show_glyph.label"
description_key = "settings.show_glyph.description"
default = true

[[panel]]
id = "panel"
entry = "panel.luau"
# Every account on one scrolling list, with linked quota details.
width = 440
height = "content"
max_height = 640
# The shell draws the Placement and Position rows for every plugin panel whether
# or not they are declared; declaring them only picks the default the user gets.
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
capture_keys = ["escape", "r", "up", "down", "left", "right", "return", "o"]
